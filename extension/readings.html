<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lodestone — Readings</title>
  <style>
    :root {
      --bg: #0a0a14; --bg-surface: #12122a; --bg-elevated: #1a1a3a;
      --text: #d8d8e8; --text-muted: #8888a8; --text-heading: #f0f0ff;
      --accent: #9B3DBE; --gold: #FFBA2E; --border: #1e1e40; --border-light: #2a2a55;
    }
    body { margin: 0; padding: 40px 20px; background: var(--bg); color: var(--text); font-family: 'Source Sans 3', system-ui, sans-serif; font-size: 15px; line-height: 1.6; }
    .card { max-width: 820px; margin: 0 auto; background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: 14px; padding: 28px 32px; }
    h1 { font-family: Georgia, 'Cormorant Garamond', serif; font-weight: 600; font-size: 26px; color: var(--text-heading); margin: 0 0 4px; }
    h2 { font-size: 15px; color: var(--text-heading); margin: 26px 0 8px; border-top: 1px solid var(--border); padding-top: 20px; }
    .tagline, .hint { color: var(--text-muted); font-size: 13px; }
    a { color: var(--gold); }
    button { background: var(--accent); border: none; color: #fff; border-radius: 8px; padding: 7px 14px; font-size: 13.5px; cursor: pointer; font-family: inherit; }
    button:hover { filter: brightness(1.15); }
    button.ghost { background: transparent; border: 1px solid var(--border-light); color: var(--text); }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 18px 0 6px; }
    .bar input[type=search] { flex: 1; min-width: 200px; padding: 8px 11px; background: var(--bg-elevated); border: 1px solid var(--border-light); border-radius: 8px; color: var(--text); font: inherit; }
    .bar select { padding: 7px 9px; background: var(--bg-elevated); border: 1px solid var(--border-light); border-radius: 8px; color: var(--text); font: inherit; }
    ul.list { list-style: none; padding: 0; margin: 10px 0 0; }
    li.reading { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
    li.reading .head { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
    li.reading .title { color: var(--text-heading); font-weight: 600; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; font-size: 15px; }
    li.reading .meta { color: var(--text-muted); font-size: 12.5px; }
    li.reading .url { font-size: 12.5px; word-break: break-all; }
    .kind { display: inline-block; font-size: 11px; border: 1px solid var(--border-light); border-radius: 10px; padding: 0 7px; margin-right: 4px; color: var(--text-muted); }
    .kind.harmonist { border-color: var(--accent); color: #d7b4ec; }
    .turns { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
    .turn { margin: 8px 0; }
    .turn .who { font-size: 11.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
    .turn.user .body { color: #cfc4e8; }
    .turn .body p { margin: 4px 0; }
    .actions { display: flex; gap: 8px; margin-top: 8px; }
    .actions button { padding: 4px 10px; font-size: 12.5px; }
    .empty { color: var(--text-muted); font-size: 13px; font-style: italic; }
    label.row { display: flex; align-items: center; gap: 10px; cursor: pointer; margin: 10px 0 4px; }
    input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Readings</h1>
    <div class="tagline">Every page Lodestone has read with you, with its address. <a href="options.html">Settings</a></div>
    <div class="bar">
      <input id="q" type="search" placeholder="Search titles, addresses and what was said" aria-label="Search readings" />
      <select id="kind" aria-label="Kind of reading">
        <option value="">All kinds</option>
        <option value="harmonist">Harmonist readings</option>
        <option value="passage">Passages</option>
        <option value="absorb">Absorbed pages</option>
        <option value="summary">Summaries</option>
        <option value="question">Questions</option>
      </select>
      <button id="export" class="ghost" title="Exports the readings shown (all of them when nothing is searched)">Export as Markdown</button>
    </div>
    <div class="hint" id="count"></div>

    <h2>In your memory</h2>
    <div class="hint" id="mem-hint"></div>
    <ul class="list" id="mem"></ul>

    <h2>On this browser only</h2>
    <div class="hint">Readings made without signing in. They are kept in this browser alone and never leave it; the newest 300 are kept.</div>
    <label class="row"><input type="checkbox" id="keep" /><span>Keep anonymous readings on this browser</span></label>
    <ul class="list" id="anon"></ul>
    <button class="ghost" id="forget-anon" hidden>Forget every anonymous reading</button>
  </div>
  <script type="module" src="readings.js"></script>
</body>
</html>
